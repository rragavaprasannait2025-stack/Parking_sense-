# ─── ParkSense-X Backend ─────────────────────────────────────────────────────
spring.application.name=parksense-x-backend
server.port=8080
server.servlet.context-path=

# ─── Database ─────────────────────────────────────────────────────────────────
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/parksensex?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:parksensex123}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.open-in-view=false

# ─── JWT ──────────────────────────────────────────────────────────────────────
parksensex.jwt.secret=${PARKSENSEX_JWT_SECRET:parksensex_secret_key_min_256_bits_change_in_production_abc123}
parksensex.jwt.expiration=86400000

# ─── CORS ─────────────────────────────────────────────────────────────────────
parksensex.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://localhost:4173}

# ─── ML Service ───────────────────────────────────────────────────────────────
parksensex.ml.service.url=${PARKSENSEX_ML_SERVICE_URL:http://localhost:8001}

# ─── Scheduling ───────────────────────────────────────────────────────────────
spring.task.scheduling.pool.size=4

# ─── Actuator ─────────────────────────────────────────────────────────────────
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized

# ─── Logging ──────────────────────────────────────────────────────────────────
logging.level.com.parksensex=INFO
logging.level.org.springframework.security=WARN
logging.level.org.springframework.web=WARN
